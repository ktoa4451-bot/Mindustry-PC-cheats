
name: Mindustry Private Toolkit Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository files:"
          ls -la

          if [ ! -f mindustry-helper.zip ]; then
            echo "::error::mindustry-helper.zip not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -o mindustry-helper.zip -d extracted

          echo "Extracted project:"
          find extracted -maxdepth 5 -type f

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail

          MOD_JSON=$(find extracted -type f -name mod.json -print -quit)

          if [ -z "$MOD_JSON" ]; then
            echo "::error::mod.json not found inside archive"
            exit 1
          fi

          MOD_DIR=$(dirname "$MOD_JSON")

          if [ ! -d "$MOD_DIR/scripts" ]; then
            echo "::error::scripts directory not found"
            exit 1
          fi

          echo "Project validated successfully"

      - name: Package mod
        shell: bash
        run: |
          set -euo pipefail

          MOD_JSON=$(find extracted -type f -name mod.json -print -quit)
          MOD_DIR=$(dirname "$MOD_JSON")

          cd "$MOD_DIR"
          zip -r "$GITHUB_WORKSPACE/helper-private.zip" mod.json scripts

          echo "Final archive:"
          unzip -l "$GITHUB_WORKSPACE/helper-private.zip"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-Private-Toolkit
          path: helper-private.zip
          if-no-files-found: error
          
