name: Package mod
on: [push, workflow_dispatch]
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip mod
        run: zip -r helper-private.zip mod.json scripts
      - uses: actions/upload-artifact@v4
        with:
          name: helper-private
          path: helper-private.zip
